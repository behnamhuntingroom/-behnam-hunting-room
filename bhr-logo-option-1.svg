<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 850" role="img" aria-labelledby="title desc">
<title id="title">BEHNAM HUNTING ROOM — BHR monogram</title><desc id="desc">Gold BHR monogram with an upward arrow and sweep, silver BEHNAM and gold HUNTING ROOM lettering on a black trading-chart background.</desc>
